name: Feature request
description: An idea or a wish for something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation in which you miss something.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Sketches or examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
